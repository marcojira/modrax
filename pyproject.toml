[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modrax"
version = "0.1.0"
description = "A modular JAX reinforcement learning framework with composable components"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Marco Jiralerspong"}
]
dependencies = [
    "jax[cuda]",
    "jaxlib",
    "flax",
    "optax",
    "orbax-checkpoint",
    "chex",
    "numpy",
    "typing-extensions",
    "pydantic",
    "jaxtyping",
    "requests",
    "opencv-python",
    "wandb[media]",
    # Envs
    "craftax",
    "gymnax",
    "jumanji",
    # "octax", Needs to be installed from source
    "pgx",
    "playground",
    "simple-parsing>=0.1.8",
    "rich-argparse>=1.7.2",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/modrax"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["F722", "N803", "N806", "UP035", "N811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
