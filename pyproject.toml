[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modrax"
version = "0.1.0"
description = "A modular JAX reinforcement learning framework with composable components"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Marco Jiralerspong"}
]
dependencies = [
    "jax[cuda]",
    "flax",
    "optax",
    "orbax-checkpoint",
    "numpy",
    "jaxtyping",
    "imageio",
    "rich",
    "tqdm",
    "wandb[media]",
    "simple-parsing>=0.1.8",
    "rich-argparse>=1.7.2",
]

[project.optional-dependencies]
craftax = ["craftax"]
gymnax = ["gymnax", "matplotlib"]
octax = ["octax"]
pgx = ["pgx"]
mujoco = ["playground"]
sequax = ["sequax @ git+https://github.com/marcojira/sequax.git"]
all = [
    "craftax",
    "gymnax",
    "matplotlib",
    "octax",
    "pgx",
    "playground",
    "sequax"
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/modrax"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["F722", "N803", "N806", "UP035", "N811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
